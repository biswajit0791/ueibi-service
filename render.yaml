services:
  - type: web
    name: ueibi-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAIL_TRANSPORT
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: UEIBI_NOTIFY_EMAIL
        sync: false
      - key: LICENSE_UNIT_PRICE
        value: "3999"
      - key: GST_RATE
        value: "0.18"
      - key: APP_PASSWORD
        sync: false
